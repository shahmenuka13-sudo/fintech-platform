apiVersion: v1
kind: ConfigMap
metadata:
  name: fingyan-app-config
  namespace: fingyan-ns # Assuming a namespace 'fingyan-ns'
data:
  # Backend Configuration
  PYTHONUNBUFFERED: "1"
  # POSTGRES_HOST will be the K8s service name for PostgreSQL, e.g., "postgres-service"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  # POSTGRES_DB can be here if not considered secret, or in the secret. Let's put it here for now.
  POSTGRES_DB_NAME: "fingyan_db" # Renamed to avoid conflict with secret key if also named POSTGRES_DB

  REDIS_HOST: "redis-service" # K8s service name for Redis
  REDIS_PORT: "6379"

  # Frontend Configuration
  # This URL will be used by the Streamlit frontend to talk to the FastAPI backend
  # 'backend-service' is the K8s service name for the FastAPI backend.
  # The port '8000' is the targetPort of the backend service.
  FASTAPI_BACKEND_URL: "http://backend-service:8000/api"
  STREAMLIT_SERVER_PORT: "8501" # Port Streamlit runs on inside its container

  # Add other non-sensitive configurations here
  # Example:
  # LOG_LEVEL: "INFO"
  # DEFAULT_PREDICTION_MODEL: "prophet_trend_v1"
---
# Example of creating a namespace if you don't have one
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: fingyan-ns
