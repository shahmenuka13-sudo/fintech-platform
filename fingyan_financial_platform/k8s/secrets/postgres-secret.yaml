apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: fingyan-ns # Ensure this matches your deployment namespace
type: Opaque
data:
  # These keys (POSTGRES_USER, POSTGRES_PASSWORD) should match what your
  # PostgreSQL image or your application expects.
  # For the official PostgreSQL image, these are typically POSTGRES_USER and POSTGRES_PASSWORD.
  # For the application connecting to Postgres, it might also use these env var names,
  # or specific keys like DB_USER, DB_PASSWORD.

  # Username: fingyan_user -> echo -n 'fingyan_user' | base64 -> ZmluZ3lhbl91c2Vy
  POSTGRES_USER: ZmluZ3lhbl91c2Vy

  # Password: SuperSecretPassword123 -> echo -n 'SuperSecretPassword123' | base64 -> U3VwZXJTZWNyZXRQYXNzd29yZDEyMw==
  POSTGRES_PASSWORD: U3VwZXJTZWNyZXRQYXNzd29yZDEyMw==

  # Optional: If you also want the database name to be part of the secret
  # DB_NAME: ZmluZ3lhbl9kYg== # fingyan_db

  # Note: If your application's backend code (e.g., database_service.py) expects DATABASE_URL,
  # you could also store the full URL here, base64 encoded.
  # However, it's often better to construct it in the pod from components (host from ConfigMap, user/pass from Secret).
  # Example for DATABASE_URL:
  # DATABASE_URL: cG9zdGdyZXNxbDovL2Zpbmd5YW5fdXNlcjpTdXBlclNlY3JldFBhc3N3b3JkMTIzQHBvc3RncmVzLXNlcnZpY2U6NTQzMi9maW5neWFuX2Ri
  # (postgresql://fingyan_user:SuperSecretPassword123@postgres-service:5432/fingyan_db)
  # For now, we will pass components to the backend and let it construct the URL.
  # The backend deployment will need to reference these secret keys.
  # The PostgreSQL deployment will also use these to initialize the database.
