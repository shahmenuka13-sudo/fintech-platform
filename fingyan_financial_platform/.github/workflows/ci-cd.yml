name: Fingyan CI/CD

on:
  push:
    branches:
      - main
      - develop # Or any other branches you want to trigger CI/CD
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install dev/test specific dependencies if separated
        # pip install black ruff mypy pytest pytest-cov playwright

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Format with Black (Check only)
      run: |
        black --check .

    - name: Type check with MyPy
      run: |
        mypy . --exclude 'frontend/app.py' # Exclude files that might have issues with streamlit's magic or specific library typings initially

    - name: Run Pytest
      run: |
        pytest backend/tests --cov=backend --cov-report=xml # Assuming tests are in backend/tests

    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v3
    #   with:
    #     token: ${{ secrets.CODECOV_TOKEN }} # Optional: if you use Codecov
    #     files: ./coverage.xml
    #     fail_ci_if_error: true

  build-and-push-docker:
    needs: lint-and-test # Run after tests pass
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') # Only on push to main or develop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to publish packages to GitHub Packages

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN is automatically available

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        dockerfile: fingyan_financial_platform/backend/Dockerfile # Ensure correct path to Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/fingyan-backend:latest
          ghcr.io/${{ github.repository_owner }}/fingyan-backend:${{ github.sha }}
        platforms: linux/amd64 # Specify platform if needed, good practice

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        dockerfile: fingyan_financial_platform/frontend/Dockerfile # Ensure correct path to Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/fingyan-frontend:latest
          ghcr.io/${{ github.repository_owner }}/fingyan-frontend:${{ github.sha }}
        platforms: linux/amd64

  deploy: # Placeholder for deployment job
    needs: build-and-push-docker
